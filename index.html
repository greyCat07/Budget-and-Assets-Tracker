<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Global defensive guard for external browser extensions (MetaMask, Phantom, Web3 wallets)
      // Prevents unhandled extension injection rejections in sandboxed iframes from bubbling up
      (function() {
        function isExtensionError(err) {
          if (!err) return false;
          var str = (typeof err === 'string' ? err : (err.message || err.stack || String(err))).toLowerCase();
          return (
            str.includes('metamask') ||
            str.includes('failed to connect to metamask') ||
            str.includes('ethereum') ||
            str.includes('chrome-extension://') ||
            str.includes('moz-extension://') ||
            str.includes('safari-extension://') ||
            str.includes('evm provider')
          );
        }

        window.addEventListener('unhandledrejection', function(event) {
          if (isExtensionError(event.reason)) {
            console.warn('[Extension Guard] Handled browser extension rejection:', event.reason);
            event.preventDefault();
            if (typeof event.stopImmediatePropagation === 'function') {
              event.stopImmediatePropagation();
            }
          }
        }, true);

        window.addEventListener('error', function(event) {
          if (isExtensionError(event.message) || isExtensionError(event.error) || (event.filename && isExtensionError(event.filename))) {
            console.warn('[Extension Guard] Handled browser extension error:', event.message);
            event.preventDefault();
            if (typeof event.stopImmediatePropagation === 'function') {
              event.stopImmediatePropagation();
            }
          }
        }, true);
      })();
    </script>
